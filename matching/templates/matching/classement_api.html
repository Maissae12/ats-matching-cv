{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Classement des candidats — NeoMorIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'matching/style.css' %}" rel="stylesheet">
    <style>
        :root {
            --navy: #142c54;
            --navy-dark: #0c1d3a;
            --blue: #3d8fd1;
            --blue-light: #eaf3fb;
        }

        body {
            background-color: #f5f8fb;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin: 2rem 0 1.6rem;
        }

        .page-header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .page-header img {
            height: 42px;
            width: auto;
        }

        .page-header h1 {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--navy-dark);
            margin: 0;
        }

        .page-header p {
            color: #6b7690;
            font-size: 0.9rem;
            margin: 0.15rem 0 0;
        }

        .btn-outline-navy-sm {
            border: 1px solid var(--navy);
            color: var(--navy);
            font-weight: 500;
            border-radius: 8px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-outline-navy-sm:hover {
            background-color: var(--navy);
            color: #fff;
        }

        .ranking-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(20, 44, 84, 0.07);
        }

        .ranking-card .card-body {
            padding: 1.8rem;
        }

        .ranking-card .card-title {
            font-weight: 700;
            color: var(--navy-dark);
        }

        table {
            border-collapse: collapse;
        }

        table th, table td {
            border: 1px solid #dde3ec;
        }

        table th {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6b7690;
            font-weight: 700;
            border-bottom: 2px solid #dde3ec;
            cursor: pointer;
            padding: 0.6rem;
        }

        table th:hover {
            color: var(--blue);
        }

        table td {
            font-size: 0.9rem;
            vertical-align: middle;
            padding: 0.6rem;
        }

        .rang-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--blue-light);
            color: var(--navy);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .rang-badge.rang-1 {
            background: linear-gradient(135deg, #f5c451, #d99c1d);
            color: #fff;
        }

        .score-jauge {
            position: relative;
            background: #eef1f6;
            border-radius: 20px;
            height: 22px;
            width: 130px;
            overflow: hidden;
        }

        .score-jauge-remplissage {
            background: linear-gradient(90deg, var(--blue), var(--navy));
            height: 100%;
        }

        .score-jauge.score-faible .score-jauge-remplissage {
            background: linear-gradient(90deg, #e6a4a4, #c0392b);
        }

        .score-jauge-valeur {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--navy-dark);
        }

        .btn-sm.btn-outline-navy {
            border: 1px solid var(--navy);
            color: var(--navy);
            border-radius: 7px;
            font-size: 0.78rem;
        }

        .btn-sm.btn-outline-navy:hover {
            background-color: var(--navy);
            color: #fff;
        }

        .modal-header {
            border-bottom: 1px solid #eef1f6;
        }

        .modal-title {
            font-weight: 700;
            color: var(--navy-dark);
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="page-header">
            <div class="page-header-left">
                <img src="{% static 'matching/img/logo.jpg' %}" alt="NeoMorIT">
                <div>
                    <h1 id="offre-titre">Chargement...</h1>
                    <p id="offre-description"></p>
                </div>
            </div>
            <a href="/offres/" class="btn btn-outline-navy-sm">
                <i class="bi bi-arrow-left me-1"></i>Retour aux offres
            </a>
        </div>

        <div class="card ranking-card">
            <div class="card-body">
                <h5 class="card-title mb-3">Classement des candidats</h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Rang</th>
                                <th>Candidat</th>
                                <th onclick="trierPar('score_final')">Score  ⇅</th>
                                <th>CV</th>
                                <th></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tableau-resultats">
                            <tr><td colspan="6" class="text-center py-4 text-muted">Chargement des résultats...</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <div id="zone-erreurs" class="mt-3 mb-4"></div>

    </div>

    <div class="modal fade" id="modalCompetences" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNomCandidatComp">Candidat</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="fw-semibold mb-2">Compétences en commun</p>
                    <div id="modalCompetencesCommunes" class="mb-3"></div>

                    <p class="fw-semibold mb-2">Compétences manquantes</p>
                    <div id="modalCompetencesManquantes"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalSousScores" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNomCandidatDetail">Candidat</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalSousScoresContenu">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const offreId = {{ offre_id }};
        let dernierResultats = [];

        function jauge(valeur) {
            const pourcentage = Math.round(valeur * 100);
            const classeFaible = valeur < 0.3 ? "score-faible" : "";
            return `
                <div class="score-jauge ${classeFaible}">
                    <div class="score-jauge-remplissage" style="width:${pourcentage}%"></div>
                    <div class="score-jauge-valeur">${valeur.toFixed(3)}</div>
                </div>
            `;
        }

        function afficherCompetences(nomCandidat, communes, manquantes) {
            document.getElementById('modalNomCandidatComp').textContent = nomCandidat;

            const zoneCommunes = document.getElementById('modalCompetencesCommunes');
            zoneCommunes.innerHTML = communes.length > 0
                ? communes.map(c => `<span class="badge bg-success me-1 mb-1">${c}</span>`).join('')
                : '<span class="text-muted">Aucune</span>';

            const zoneManquantes = document.getElementById('modalCompetencesManquantes');
            zoneManquantes.innerHTML = manquantes.length > 0
                ? manquantes.map(c => `<span class="badge bg-light text-muted border me-1 mb-1">${c}</span>`).join('')
                : '<span class="text-muted">Aucune</span>';

            const modal = new bootstrap.Modal(document.getElementById('modalCompetences'));
            modal.show();
        }

        function afficherSousScores(nomCandidat, sousScores) {
            document.getElementById('modalNomCandidatDetail').textContent = nomCandidat;

            let html = "";
            for (const [section, valeur] of Object.entries(sousScores || {})) {
                if (valeur === null) {
                    html += `<p><strong>${section} :</strong> <span class="text-muted">Section non détectée</span></p>`;
                } else {
                    html += `<p><strong>${section} :</strong> ${jauge(valeur)}</p>`;
                }
            }
            document.getElementById('modalSousScoresContenu').innerHTML = html || '<p class="text-muted">Aucun détail disponible.</p>';

            const modal = new bootstrap.Modal(document.getElementById('modalSousScores'));
            modal.show();
        }

        function afficherTableau(resultats) {
            const tbody = document.getElementById('tableau-resultats');
            tbody.innerHTML = "";

            if (resultats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Aucun candidat pour cette offre.</td></tr>';
                return;
            }

            resultats.forEach((score, index) => {
                const rang = index + 1;
                const rangHtml = `<span class="rang-badge ${rang === 1 ? 'rang-1' : ''}">${rang}</span>`;

                const communes = JSON.stringify(score.competences_communes || []).replace(/"/g, '&quot;');
                const manquantes = JSON.stringify(score.competences_manquantes || []).replace(/"/g, '&quot;');
                const sousScoresJson = JSON.stringify(score.sous_scores || {}).replace(/"/g, '&quot;');

                const ligne = `
                    <tr>
                        <td>${rangHtml}</td>
                        <td class="fw-semibold">${score.nom_candidat}</td>
                        <td>${jauge(score.score_final)}</td>
                        <td><a href="${score.fichier_cv}" target="_blank" class="btn btn-sm btn-outline-navy">Voir le CV</a></td>
                        <td>
                            <button class="btn btn-sm btn-outline-navy" onclick='afficherCompetences("${score.nom_candidat}", ${communes}, ${manquantes})'>
                                Compétences
                            </button>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-navy" onclick='afficherSousScores("${score.nom_candidat}", ${sousScoresJson})'>
                                Détail
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += ligne;
            });
        }

        function trierPar(champ) {
            const trie = [...dernierResultats].sort((a, b) => b[champ] - a[champ]);
            afficherTableau(trie);
        }

        fetch(`/api/offres/${offreId}/`)
            .then(response => response.json())
            .then(offre => {
                document.getElementById('offre-titre').textContent = offre.titre;
                document.getElementById('offre-description').textContent = offre.description;
            });

        fetch(`/api/offres/${offreId}/classement/`)
            .then(response => response.json())
            .then(data => {
                dernierResultats = data.resultats;
                afficherTableau(dernierResultats);

                const zoneErreurs = document.getElementById('zone-erreurs');
                if (data.erreurs && data.erreurs.length > 0) {
                    let htmlErreurs = '<div class="alert alert-warning"><strong>CV non traités :</strong><ul class="mb-0">';
                    data.erreurs.forEach(e => {
                        htmlErreurs += `<li>${e.cv} : ${e.erreur}</li>`;
                    });
                    htmlErreurs += '</ul></div>';
                    zoneErreurs.innerHTML = htmlErreurs;
                } else {
                    zoneErreurs.innerHTML = "";
                }
            });
    </script>

</body>
</html>
