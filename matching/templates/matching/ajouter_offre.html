{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle offre — NeoMorIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'matching/style.css' %}" rel="stylesheet">
    <style>
        :root {
            --navy: #142c54;
            --navy-dark: #0c1d3a;
            --blue: #3d8fd1;
        }
        body {
            background-color: #f5f8fb;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .page-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin: 2rem 0 1.6rem;
        }
        .page-header img { height: 40px; width: auto; }
        .page-header h3 { font-weight: 700; color: var(--navy-dark); margin: 0; }
        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(20, 44, 84, 0.08);
        }
        .form-card .card-body { padding: 2rem; }
        .section-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--blue);
            margin: 1.4rem 0 0.6rem;
        }
        .section-label:first-of-type { margin-top: 0; }
        label.form-label { font-weight: 500; color: #37415a; font-size: 0.88rem; }
        .form-control, .form-select {
            border-radius: 9px;
            border: 1px solid #dfe3ea;
            font-size: 0.92rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(61, 143, 209, 0.15);
        }
        .form-text { font-size: 0.78rem; }
        .btn-navy {
            background-color: var(--navy);
            border-color: var(--navy);
            color: #fff;
            font-weight: 600;
            border-radius: 9px;
            padding: 0.65rem;
        }
        .btn-navy:hover {
            background-color: var(--navy-dark);
            border-color: var(--navy-dark);
            color: #fff;
        }
        .btn-outline-navy-sm {
            border: 1px solid var(--navy);
            color: var(--navy);
            font-weight: 500;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .btn-outline-navy-sm:hover { background-color: var(--navy); color: #fff; }
    </style>
</head>
<body>

    <div class="container py-3" style="max-width: 700px;">

        <div class="page-header justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <img src="{% static 'matching/img/logo.jpg' %}" alt="NeoMorIT">
                <h3>Nouvelle offre</h3>
            </div>
            <a href="/offres/" class="btn btn-outline-navy-sm btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Voir les offres
            </a>
        </div>

        <div class="card form-card">
            <div class="card-body">

                <form id="form-offre">

                    <div class="section-label">Poste</div>

                    <div class="mb-3">
                        <label for="titre" class="form-label">Titre du poste</label>
                        <input type="text" class="form-control" id="titre" list="titres-suggestions" required>
                        <datalist id="titres-suggestions">
                            <option value="Développeur Full Stack (H/F)">
                            <option value="Développeur Backend (H/F)">
                            <option value="Développeur Frontend (H/F)">
                            <option value="Ingénieur DevOps (H/F)">
                            <option value="Chargé(e) de Marketing Digital">
                            <option value="Comptable Général (H/F)">
                            <option value="Gestionnaire RH (H/F)">
                            <option value="Infirmier(ère) Polyvalent(e)">
                            <option value="Ingénieur Génie Civil / Chef de Projet BTP">
                            <option value="Commercial(e) Terrain (H/F)">
                        </datalist>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="type_contrat" class="form-label">Type de contrat</label>
                            <select class="form-select" id="type_contrat">
                                <option value="CDI">CDI</option>
                                <option value="CDD">CDD</option>
                                <option value="Stage">Stage</option>
                               </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="salaire" class="form-label">Salaire (MAD/mois)</label>
                            <input type="text" class="form-control" id="salaire" placeholder="Ex: 8000 - 12000">
                        </div>
                    </div>

                    <div class="section-label">Description</div>

                    <div class="mb-4">
                        <label for="description" class="form-label">
                            Description compl&egrave;te du poste
                        </label>
                        <textarea class="form-control" id="description" rows="16"
                                  placeholder="Décrivez ici le poste, les missions, le profil recherché et les compétences attendues, les avantages..."
                                  required></textarea>
                        <div class="form-text">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="statut" class="form-label">Statut</label>
                        <select class="form-select" id="statut">
                            <option value="ouverte">Ouverte</option>
                            <option value="fermee">Fermée</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-navy w-100">
                        Créer l'offre
                    </button>
                </form>

                <div id="message" class="mt-3"></div>
            </div>
        </div>

    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        document.getElementById('form-offre').addEventListener('submit', function (e) {
            e.preventDefault();

            const titre = document.getElementById('titre').value;
            const type_contrat = document.getElementById('type_contrat').value;
            const salaire = document.getElementById('salaire').value;
            const description = document.getElementById('description').value;
            const statut = document.getElementById('statut').value;
            const messageDiv = document.getElementById('message');

            fetch('/api/offres/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ titre, type_contrat, salaire, description, statut })
            })
            .then(response => {
                if (!response.ok) return response.json().then(err => { throw new Error(JSON.stringify(err)); });
                return response.json();
            })
            .then(data => {
                messageDiv.innerHTML = `
                    <div class="alert alert-success">
                        Offre créée avec succès !
                        <a href="/upload-cv/" class="alert-link">Déposer des CV pour cette offre</a>
                    </div>
                `;
                document.getElementById('form-offre').reset();
            })
            .catch(error => {
                messageDiv.innerHTML = `<div class="alert alert-danger">Erreur : ${error.message}</div>`;
            });
        });
    </script>

</body>
</html>
