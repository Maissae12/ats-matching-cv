{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Déposer des CV — NeoMorIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'matching/style.css' %}" rel="stylesheet">
    <style>
        :root {
            --navy: #142c54;
            --navy-dark: #0c1d3a;
            --blue: #3d8fd1;
            --blue-light: #eaf3fb;
        }

        body {
            background-color: #f5f8fb;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.7rem;
            margin: 2rem 0 1.6rem;
        }

        .page-header-left {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .page-header img {
            height: 40px;
            width: auto;
        }

        .page-header h3 {
            font-weight: 700;
            color: var(--navy-dark);
            margin: 0;
        }

        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(20, 44, 84, 0.08);
        }

        .form-card .card-body {
            padding: 2rem;
        }

        label.form-label {
            font-weight: 500;
            color: #37415a;
            font-size: 0.88rem;
        }

        .form-control, .form-select {
            border-radius: 9px;
            border: 1px solid #dfe3ea;
            font-size: 0.92rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(61, 143, 209, 0.15);
        }

        .form-text {
            font-size: 0.78rem;
        }

        .dropzone {
            border: 2px dashed #c7d3e3;
            border-radius: 12px;
            background-color: var(--blue-light);
            padding: 1.6rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--blue);
            background-color: #ddeefb;
        }

        .dropzone i {
            font-size: 1.8rem;
            color: var(--blue);
            display: block;
            margin-bottom: 0.4rem;
        }

        .dropzone-text {
            font-size: 0.85rem;
            color: #48546b;
            margin: 0;
        }

        #liste-fichiers .list-group-item {
            border: 1px solid #eef1f6;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #liste-fichiers .list-group-item i {
            color: var(--blue);
        }

        .btn-navy {
            background-color: var(--navy);
            border-color: var(--navy);
            color: #fff;
            font-weight: 600;
            border-radius: 9px;
            padding: 0.65rem;
        }

        .btn-navy:hover:not(:disabled) {
            background-color: var(--navy-dark);
            border-color: var(--navy-dark);
            color: #fff;
        }

        .btn-navy:disabled {
            background-color: #b7c4d6;
            border-color: #b7c4d6;
        }

        .btn-outline-navy-sm {
            border: 1px solid var(--navy);
            color: var(--navy);
            font-weight: 500;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .btn-outline-navy-sm:hover {
            background-color: var(--navy);
            color: #fff;
        }

        .btn-success-navy {
            background-color: var(--blue);
            border-color: var(--blue);
            color: #fff;
            font-weight: 600;
            border-radius: 9px;
        }

        .btn-success-navy:hover {
            background-color: var(--navy);
            border-color: var(--navy);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container py-3" style="max-width: 620px;">

        <div class="page-header">
            <div class="page-header-left">
                <img src="{% static 'matching/img/logo.jpg' %}" alt="NeoMorIT">
                <h3>Déposer des CV</h3>
            </div>
            <a href="/offres/" class="btn btn-outline-navy-sm btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Voir les offres
            </a>
        </div>

        <div class="card form-card">
            <div class="card-body">

                <div class="mb-3">
                    <label for="offre" class="form-label">Offre concernée</label>
                    <select class="form-select" id="offre" required>
                        <option value="" disabled selected>-- Choisir une offre --</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ajouter des fichiers CV (PDF)</label>
                    <label for="fichier-input" class="dropzone d-block mb-0">
                        <i class="bi bi-cloud-arrow-up-fill"></i>
                        <p class="dropzone-text mb-0">
                            Cliquez ici pour choisir des fichiers PDF ou TXT<br>
                            <span class="text-muted">Vous pouvez cliquer plusieurs fois pour ajouter des fichiers de dossiers différents</span>
                        </p>
                    </label>
                    <input type="file" class="d-none" id="fichier-input" accept=".pdf,.txt" multiple>
                </div>

                <ul id="liste-fichiers" class="list-group mb-3"></ul>

                <button type="button" id="btn-envoyer" class="btn btn-navy w-100">
                    Envoyer les CV
                </button>

                <div id="message" class="mt-3"></div>
            </div>
        </div>

    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        let fichiersEnAttente = [];

        fetch('/api/offres/')
            .then(response => response.json())
            .then(offres => {
                const select = document.getElementById('offre');
                offres.forEach(offre => {
                    const option = document.createElement('option');
                    option.value = offre.id;
                    option.textContent = offre.titre;
                    select.appendChild(option);
                });
            });

        function afficherListeFichiers() {
            const liste = document.getElementById('liste-fichiers');
            liste.innerHTML = "";

            fichiersEnAttente.forEach((fichier, index) => {
                const item = document.createElement('li');
                item.className = "list-group-item d-flex justify-content-between align-items-center";
                item.innerHTML = `
                    <span><i class="bi bi-file-earmark-pdf me-2"></i>${fichier.name}</span>
                    <button type="button" class="btn btn-sm btn-outline-danger" data-index="${index}">
                        Retirer
                    </button>
                `;
                liste.appendChild(item);
            });

            document.getElementById('btn-envoyer').disabled = fichiersEnAttente.length === 0;
        }

        document.getElementById('fichier-input').addEventListener('change', function (e) {
            for (const fichier of e.target.files) {
                fichiersEnAttente.push(fichier);
            }
            e.target.value = "";
            afficherListeFichiers();
        });

        document.getElementById('liste-fichiers').addEventListener('click', function (e) {
            if (e.target.dataset.index !== undefined) {
                fichiersEnAttente.splice(e.target.dataset.index, 1);
                afficherListeFichiers();
            }
        });

        function envoyerFichier(fichier, offreId) {
            const formData = new FormData();
            formData.append('fichier', fichier);
            formData.append('offre', offreId);

            return fetch('/api/cvs/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: formData
            }).then(response => {
                if (!response.ok) {
                    return response.json().then(err => {
                        let messageErreur = "Erreur inconnue";
                        if (err.fichier) {
                            messageErreur = err.fichier[0];
                        } else if (err.non_field_errors) {
                            messageErreur = err.non_field_errors[0];
                        }
                        throw new Error(messageErreur);
                    });
                }
                return response.json();
            });
        }

        document.getElementById('btn-envoyer').addEventListener('click', function () {
            const offreId = document.getElementById('offre').value;

            if (!offreId) {
                alert("Merci de choisir une offre avant d'envoyer.");
                return;
            }

            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="alert alert-info">Envoi de ${fichiersEnAttente.length} fichier(s) en cours...</div>`;

            let resultats = [];
            let promesse = Promise.resolve();

            for (const fichier of fichiersEnAttente) {
                promesse = promesse.then(() =>
                    envoyerFichier(fichier, offreId)
                        .then(data => resultats.push({ ok: true, nom: data.nom_candidat }))
                        .catch(err => resultats.push({ ok: false, nom: fichier.name, erreur: err.message }))
                );
            }

            promesse.then(() => {
                let html = "<ul class='list-group mb-3'>";
                resultats.forEach(r => {
                    if (r.ok) {
                        html += `<li class="list-group-item list-group-item-success">${r.nom}</li>`;
                    } else {
                        html += `<li class="list-group-item list-group-item-danger">Échec : ${r.nom} — ${r.erreur}</li>`;
                    }
                });
                html += "</ul>";
                html += `<a href="/page-classement/${offreId}/" class="btn btn-success-navy w-100">Voir le classement pour cette offre</a>`;
                messageDiv.innerHTML = html;

                fichiersEnAttente = [];
                afficherListeFichiers();
            });
        });
    </script>

</body>
</html>
