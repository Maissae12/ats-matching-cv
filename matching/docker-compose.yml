version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: projet_nlp_cv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MAISSAE
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db

volumes:
  postgres_data: